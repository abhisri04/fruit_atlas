<!DOCTYPE html>
<html>
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`, e.g. "/fruit_atlas/"
    when published to GitHub Pages. Must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="UPLYFA — Experience more.">
  <meta name="theme-color" content="#0F766E">

  <!-- Installable app (Android "Add to Home screen", iOS home screen) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UPLYFA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UPLYFA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FAF9F6; }
    /* Branded splash shown while Flutter loads; removed on first frame. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FAF9F6; transition: opacity .35s ease;
      font-family: Georgia, 'Noto Serif', serif; color: #0F172A;
    }
    #splash img {
      width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 10px 30px rgba(15, 118, 110, .25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    #splash .name { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
    #splash .tag { font-family: Roboto, Arial, sans-serif; font-size: 14px; color: #64748B; margin-top: -10px; }
    #splash.hide { opacity: 0; pointer-events: none; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading UPLYFA">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">UPLYFA</div>
    <div class="tag">Experience more.</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
